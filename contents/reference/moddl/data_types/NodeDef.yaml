dataType:
  name: NodeDef
  desc:
    - |
      **ノード定義**を表す型です。ノード定義とは、モジュール定義のうち、そこから生成されるモジュールが単体のノードであるものです。

      ノード定義はモジュール定義の特別な場合であるため、%type(NodeDef) 型は %type(ModuleDef) 型の部分型です。よって、全ての %type(NodeDef) 型の値はそのまま %type(ModuleDef) 型の値としても用いることができます。

      %type(NodeDef) 型の値に対しては、%oper(set_node_params) 演算子を使ってパラメータ入力を指定することができます。これは %type(NodeDef) 型以外の %type(ModuleDef) 型の値に対しては行えません。

  notations:
    - |
      %link(/reference/moddl/builtin_library/node_defs/toc, 組み込みライブラリに「ノード定義」として収録された項目)は全て、%type(NodeDef) 型の値か、%type(NodeDef) 型の値を返す関数です。

      これら以外でノード定義を新規に作り出す方法は、現時点ではありません。

      %type(NodeDef) 型の値に %oper(set_node_params) 演算子を適用した結果は、（%type(ModuleDef) 型の値ではありますが）%type(NodeDef) 型の値ではありません。

  details:
    - |
      モジュール定義に関する詳細は「%link(/reference/moddl/features/nodes_and_modules)」を参照してください。


