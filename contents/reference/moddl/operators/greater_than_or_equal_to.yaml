function:
  name: '>='
  desc: |
    大なり等価比較を行います。

  operatorNotation: |
    `lhs >= rhs`

  typeParams:
    -
      name: (Lhs, Rhs, Result)
      type: (%type(Number), %type(Number), Boolean)<br>| (%type(Number), %type(ModuleDef), ModuleDef)<br>| (ModuleDef, (%type(Number) | ModuleDef), ModuleDef)

  params:
    -
      name: '`lhs`'
      type: Lhs
      required: true
      desc: |
        左の項。

    -
      name: '`rhs`'
      type: Rhs
      required: true
      desc: |
        右の項。

  value:
    type: Result
    desc: |
      `lhs` が `rhs` より大きいもしくは等しいかどうか。

  details:
    - |
      この演算子は %type(Number) と %type(ModuleDef) に対してオーバーロードされています。詳細は「%link(/reference/moddl/operators/overloaded_calculations)」を参照してください。
