function:
  name: log
  desc: |
    自然対数（e を底とする対数）を求めます。

  typeParams:
    -
      name: Value
      type: '%type(Number) | %type(ModuleDef)'

  params:
    -
      name: '`arg`'
      type: Value
      required: true
      # default:
      #   value: 0
      desc: |
        真数。

  constraints: |
    ```
    arg > 0
    ```

  value:
    type: Value
    desc: |
      `arg` の自然対数。

  details:
    - |
      この関数は %type(Number) と %type(ModuleDef) に対してオーバーロードされています。詳細は「%link(/reference/moddl/operators/overloaded_calculations)」を参照してください。
